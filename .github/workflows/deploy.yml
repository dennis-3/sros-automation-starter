name: Deploy and Verify

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in check mode (dry run)'
        required: false
        default: false
        type: boolean
      tags:
        description: 'Specific Ansible tags to execute (leave blank for all)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Limit deployment to specific hosts/groups (e.g., edge_pe, r1)'
        required: false
        default: ''
        type: string
      serial_batch:
        description: 'Canary batch size (e.g. 1 or 20%)'
        required: false
        default: '100%'
        type: string
      confirm_timeout:
        description: 'Confirmed commit timeout in seconds (default: 600)'
        required: false
        default: '600'
        type: string

jobs:
  validate-and-deploy:
    runs-on: self-hosted
    env:
      SROS_USER: ${{ secrets.SROS_USER || 'admin' }}
      SROS_PASSWORD: ${{ secrets.SROS_PASSWORD || 'NokiaSros1!' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python and Ansible Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      # PR validation: Dry-run check mode only with candidate diff preview
      - name: Dry Run Deployment (Check Mode)
        if: github.event_name == 'pull_request' || inputs.dry_run == true
        run: |
          ARGS="--check --diff"
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.tags }}" ]; then
            ARGS="$ARGS --tags ${{ inputs.tags }}"
          fi
          python run_verified_deployment.py $ARGS

      # Production pipeline: 6-stage verified deployment with pre/post validation, soak, and auto-rollback
      - name: Execute Verified Deployment Pipeline
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && inputs.dry_run != true
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.tags }}" ]; then
            ARGS="$ARGS --tags ${{ inputs.tags }}"
          fi
          if [ -n "${{ inputs.serial_batch }}" ]; then
            ARGS="$ARGS --batch-size ${{ inputs.serial_batch }}"
          fi
          if [ -n "${{ inputs.confirm_timeout }}" ] && [ "${{ inputs.confirm_timeout }}" != "0" ]; then
            ARGS="$ARGS --confirm-timeout ${{ inputs.confirm_timeout }}"
          fi
          python run_verified_deployment.py $ARGS

      # Production pipeline step 4: Upload HTML visual drift report artifact
      - name: Upload Network Drift Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-drift-report
          path: snapshots/network_drift_report.html
          if-no-files-found: ignore
