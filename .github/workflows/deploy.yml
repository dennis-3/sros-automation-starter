name: Deploy to Lab
on:
  push:
    branches: [main]  # Only deploy when we merge to main

jobs:
  deploy:
    runs-on: self-hosted # action-runners are self-hosted runners that can access your lab network
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Nokia Config
        run: |
          # Run deployment via ansible-navigator using current repo inventory and playbooks
          ansible-navigator run ansible/playbooks/deploy.yml \
            -i ansible/inventory.yml \
            --mode stdout \
            --check
