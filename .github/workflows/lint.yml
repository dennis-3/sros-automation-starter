name: CI Lint and Pre-Flight Validation

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 PyYAML pre-commit

      - name: Run Pre-Flight Template and Schema Validation
        run: |
          python tests/validate_templates.py

      - name: Run Pre-Commit Hooks
        run: |
          pre-commit run --all-files || true

      - name: Run Ansible-lint
        uses: ansible/ansible-lint@v24
        with:
          requirements_file: ansible/requirements.yml
