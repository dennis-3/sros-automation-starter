name: CI Lint and Pre-Flight Validation

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation and Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 PyYAML pre-commit "ansible-core>=2.16.0,<2.18.0" "ansible-lint>=24.10.0,<25.0.0"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Pre-Flight Template and Schema Validation
        run: |
          python tests/validate_templates.py

      - name: Run Pre-Commit Hooks
        run: |
          pre-commit run --all-files || true

      - name: Run Ansible-lint
        run: |
          ansible-lint
