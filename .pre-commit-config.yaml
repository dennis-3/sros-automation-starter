---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0 # find the latest version??
    hooks:
      - id: trailing-whitespace # Removes extra spaces at the end of lines
      - id: end-of-file-fixer # Ensures files end with a newline
      - id: check-yaml # Validates YAML syntax

  # commenting out ansible-lint for now since it is not yet installed in the EE, and it is giving errors on the netconf_config module which is used in the playbooks
