[defaults]
# Default inventory path
inventory = ansible/inventory.yml

# Parallel execution across routers (default is 5)
forks = 20

# Search paths for installed Ansible collections
collections_path = ./collections:~/.ansible/collections

# Disable SSH host key checking in lab/automation environments
host_key_checking = False
retry_files_enabled = False

# Readable YAML terminal output
stdout_callback = yaml
callbacks_enabled = timer

[persistent_connection]
# NETCONF and persistent connection timeouts for heavy SROS transactions
connect_timeout = 60
command_timeout = 60
connect_retry_timeout = 30
