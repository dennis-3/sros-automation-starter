# ansible-navigator.yml
ansible-navigator:
  execution-environment:
    container-engine: podman  # or docker
    image: sros-ee-w/netbox:latest
    container-options:
      - "--tty"
    pull:
      policy: missing
    enabled: true

  playbook-artifact:
    enable: false
    save-as: "{playbook_name}-artifact.json"

  mode: stdout  # Use 'interactive' for the TUI or 'stdout' for traditional look
