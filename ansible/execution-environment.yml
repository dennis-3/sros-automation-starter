version: 3

images:
  base_image:
    name: registry.fedoraproject.org/fedora:42

dependencies:
  python_interpreter:
    package_system: python3

  ansible_core:
    package_pip: ansible-core>=2.16.0,<2.18.0

  ansible_runner:
    package_pip: ansible-runner>=2.4.0,<2.5.0

  python:
    - ncclient>=0.6.12,<0.7.0
    - pysros>=24.0.0
    - pygnmi>=0.8.15
    - paramiko>=3.4.0
    - scrapli>=2024.1.30
    - pynetbox>=7.6.0
    - netaddr>=1.3.0
    - jmespath>=1.0.0
    - lxml>=5.0.0
    - xmltodict>=0.13.0
    - jxmlease>=1.0.3
    - requests>=2.31.0
    - deepdiff>=6.7.0
    - pyats>=24.0.0
    - genie>=24.0.0

  system:
    - python3-devel
    - gcc
    - libxml2-devel
    - libxslt-devel
    - openssh-clients
    - sshpass
    - git

  galaxy:
    collections:
      - name: ansible.netcommon
        version: ">=6.1.0"
      - name: community.general
        version: ">=9.5.0,<10.0.0"
      - name: nokia.sros
        version: ">=2.1.0"
      - name: netbox.netbox
        version: ">=3.19.0"
