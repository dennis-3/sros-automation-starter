# Ansible connection & authentication settings
ansible_user: "{{ lookup('env', 'SROS_USER') | default('admin', true) }}"
ansible_password: "{{ lookup('env', 'SROS_PASSWORD') | default('NokiaSros1!', true) }}"
ansible_port: "{{ lookup('env', 'SROS_PORT') | default(830, true) | int }}"

ansible_ssh_common_args: '-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no'
ansible_host_key_auto_add: yes
ansible_host_key_checking: False
ansible_connection: ansible.netcommon.netconf
ansible_network_os: nokia.sros.sros

# Candidate datastore concurrency control:
# Acquires an exclusive NETCONF lock on the candidate datastore during pre-flight (task 01)
# and holds it across all staging tasks until commit/release in task 09 to prevent concurrent collisions.
sros_lock_candidate: true
