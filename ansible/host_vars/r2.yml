# =============================================================================
# ACTIVE BASELINE CONFIGURATION: R2
# =============================================================================
# Reference data models for BGP, IGP, MPLS, VPNs, and QoS are located in:
# examples/data_models/
# =============================================================================

system_name: "R2-PE2"

# Hardware & Card Provisioning (Nokia SR-1 / SR-1s / vSIM)
cards:
  - slot: 1
    type: "iom-1"
    mdas:
      - slot: 1
        type: "me6-100gb-qsfp28"

# Port & Connector Provisioning (Native SR OS YANG port hierarchy)
ports:
  - id: "1/1/c1"
    connector:
      breakout: "c1-100g"
  - id: "1/1/c1/1"
    ethernet:
      mode: "hybrid"
      encap_type: "dot1q"

  - id: "1/1/c2"
    connector:
      breakout: "c1-100g"
  - id: "1/1/c2/1"
    ethernet:
      mode: "hybrid"
      encap_type: "dot1q"

  - id: "1/1/c3"
    connector:
      breakout: "c1-100g"
  - id: "1/1/c3/1"
    ethernet:
      mode: "hybrid"
      encap_type: "dot1q"

# Base interfaces (Dual-Stack IPv4 / IPv6)
interfaces:
  - name: "system"
    address: "10.10.10.2"
    prefix_length: 32
    ipv6:
      address: "fd50:2026::2"
      prefix_length: 128

  - name: "toR1"
    address: "10.1.2.2"
    prefix_length: 27
    port: "1/1/c2/1:0"
    ipv6:
      address: "fd50:2026:12::2"
      prefix_length: 64
