# =============================================================================
# ACTIVE BASELINE CONFIGURATION: R2
# =============================================================================
# Reference data models for BGP, IGP, MPLS, VPNs, and QoS are located in:
# examples/data_models/
# =============================================================================

system_name: "R2-PE2"

# Hardware & Card Provisioning (Nokia SR-1 / SR-1s / vSIM)
card_slot: 1
card_type: "iom-1"
mda_slot: 1
mda_type: "me6-100gb-qsfp28"
port_connector: "breakout"
breakout_type: "c1-100g"
port_mode: "hybrid"

# Physical port channelization
provisioned_ports:
  - id: "1/1/c1"
  - id: "1/1/c2"
  - id: "1/1/c3"

# Base interfaces (Dual-Stack IPv4 / IPv6)
interfaces:
  - name: "system"
    address: "10.10.10.2"
    mask: 32
    loopback: true
    ipv6:
      address: "fd50:2026::2"
      prefix_length: 128

  - name: "toR1"
    address: "10.1.2.2"
    mask: 27
    port: "1/1/c2/1:0"
    ipv6:
      address: "fd50:2026:12::2"
      prefix_length: 64
