---
plugin: netbox.netbox.nb_inventory

# NetBox API endpoint and authentication
api_endpoint: "{{ lookup('env', 'NETBOX_URL') | default('http://172.17.0.1:8000', true) }}"
token: "{{ lookup('env', 'NETBOX_TOKEN') | default('YOUR_NETBOX_API_TOKEN', true) }}"
validate_certs: false

# Include NetBox configuration context (device-specific vars, services, and interfaces)
config_context: true
flatten_config_context: true

# Client-side cache for high-scale inventories (prevents REST API rate-limiting)
cache: "{{ lookup('env', 'NETBOX_INVENTORY_CACHE') | default(false, true) | bool }}"
cache_plugin: ansible.builtin.jsonfile
cache_timeout: 3600
cache_connection: .cache/netbox_inventory
cache_prefix: netbox

# Filter devices to only active devices with primary IPs
query_filters:
  - status: 'active'
  - has_primary_ip: 'true'

# Compose connection and host variables from NetBox data (dual-stack IPv4/IPv6 support)
compose:
  ansible_host: >-
    (primary_ip4.address if (primary_ip4 is defined and primary_ip4) else
    (primary_ip6.address if (primary_ip6 is defined and primary_ip6) else
    inventory_hostname)).split('/')[0]

# Dynamic grouping by role, site, and platform
keyed_groups:
  # Map NetBox device role slug directly to Ansible inventory groups (e.g., edge_pe, core_p)
  - prefix: ''
    separator: ''
    key: role.slug
  # Group by site (e.g., site_iad01, site_fra01)
  - prefix: 'site'
    separator: '_'
    key: site.slug
  # Group by platform (e.g., platform_nokia_sros)
  - prefix: 'platform'
    separator: '_'
    key: platform.slug

# Standard attribute groupings
group_by:
  - device_roles
  - sites
  - platforms
