---
- name: Unified Nokia SR OS Deployment
  hosts: all
  gather_facts: false
  serial: "{{ sros_serial_batch | default('100%') }}"
  max_fail_percentage: "{{ sros_max_fail_percentage | default(0) }}"

  tasks:
    - name: Execute deployment transaction with automated candidate rollback
      block:
        - name: Pre-flight variable assertions
          ansible.builtin.import_tasks: tasks/01_preflight.yml
          tags:
            - always
            - preflight
            - validate

        - name: System identity, hardware & management
          ansible.builtin.import_tasks: tasks/02_system.yml
          tags:
            - system
            - hardware
            - ntp
            - aaa
            - tacplus
            - dns

        - name: Filters and interfaces
          ansible.builtin.import_tasks: tasks/03_interfaces.yml
          tags:
            - interfaces
            - filters
            - acl
            - security
            - base-routing

        - name: Underlay routing and label distribution
          ansible.builtin.import_tasks: tasks/04_underlay.yml
          tags:
            - underlay
            - isis
            - ospf
            - mpls
            - ldp
            - rsvp
            - bier
            - segment-routing

        - name: Routing policies and prefix lists
          ansible.builtin.import_tasks: tasks/05_policies.yml
          tags:
            - policy-options
            - routing-policy
            - prefix-lists

        - name: BGP peering and multiprotocol overlay
          ansible.builtin.import_tasks: tasks/06_bgp.yml
          tags:
            - bgp
            - overlay
            - peering

        - name: Multi-service infrastructure (L2VPN & L3VPN)
          ansible.builtin.import_tasks: tasks/07_services.yml
          tags:
            - services
            - epipe
            - vpls
            - vprn
            - ies
            - sdp
            - pw-templates

        - name: Operations, QoS & Multicast
          ansible.builtin.import_tasks: tasks/08_operations.yml
          tags:
            - operations
            - qos
            - igmp
            - pim
            - multicast
            - mirror-destinations
            - mirror-sources
            - telemetry

        - name: Atomic candidate commit & verification
          ansible.builtin.import_tasks: tasks/09_commit.yml
          tags:
            - always
            - commit
            - diff
            - check

      rescue:
        - name: Discard uncommitted candidate changes on failure
          ansible.netcommon.netconf_rpc:
            rpc: discard-changes
            xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
          check_mode: false
          when: not (sros_commit_per_task | default(false))
          failed_when: false
          tags:
            - always

        - name: Cancel unconfirmed commit on failure
          ansible.netcommon.netconf_rpc:
            rpc: cancel-commit
            xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
          check_mode: false
          when:
            - not (sros_commit_per_task | default(false))
            - sros_confirm_timeout is defined and (sros_confirm_timeout | int > 0)
          failed_when: false
          tags:
            - always

        - name: Fail execution and report candidate discard
          ansible.builtin.fail:
            msg: >
              Deployment failed on {{ inventory_hostname }}.
              All uncommitted staged candidate changes have been discarded to prevent configuration drift.
          tags:
            - always
