---
- name: Raw NETCONF Operations and Candidate Comparison
  hosts: all
  gather_facts: false

  tasks:
    # =========================================================================
    # XML EDIT BOF CONFIGURATION
    # =========================================================================
    - name: Edit BOF configuration via NETCONF RPC
      tags:
        - never
        - xml-bof-config
        - bof-config-xml
      block:
        - name: Lock BOF candidate
          ansible.netcommon.netconf_rpc:
            rpc: lock
            xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
            content: |
              <target>
                <bof-candidate xmlns="urn:nokia.com:sros:ns:yang:sr:ietf-netconf-augments"/>
              </target>

        - name: Edit BOF configuration via NETCONF edit-config RPC
          ansible.netcommon.netconf_rpc:
            rpc: edit-config
            xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
            content: |
              <target>
                <bof-candidate xmlns="urn:nokia.com:sros:ns:yang:sr:ietf-netconf-augments"/>
              </target>
              <config>
                <bof
                  xmlns="urn:nokia.com:sros:ns:yang:sr:bof-conf"
                  xmlns:nc="urn:ietf:params:xml:ns:netconf:base:1.0"
                  xmlns:nokia-attr="urn:nokia.com:sros:ns:yang:sr:attributes">
                  <dns>
                    <primary-server>{{ bof_primary_dns | default('192.168.122.1') }}</primary-server>
                  </dns>
                </bof>
              </config>

        - name: Commit BOF candidate changes
          ansible.netcommon.netconf_rpc:
            rpc: commit
            xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
            content: |
              <configuration-region xmlns="urn:nokia.com:sros:ns:yang:sr:ietf-netconf-augments">
                bof
              </configuration-region>

        - name: Unlock BOF candidate
          ansible.netcommon.netconf_rpc:
            rpc: unlock
            xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
            content: |
              <target>
                <bof-candidate xmlns="urn:nokia.com:sros:ns:yang:sr:ietf-netconf-augments"/>
              </target>

    # =========================================================================
    # XML LOAD CONFIGURATION FROM FILE (REPLACE RUNNING CONFIG)
    # =========================================================================
    - name: Load XML configuration file and replace active running config
      tags:
        - never
        - xml-load-config
        - load-config-xml
      block:
        - name: Load XML configuration from file
          ansible.netcommon.netconf_config:
            target: candidate
            commit: true
            lock: always
            default_operation: replace
            content: "{{ lookup('file', config_file | default(playbook_dir ~ '/../../snapshots/' ~ inventory_hostname ~ '_config.xml')) }}"

    # =========================================================================
    # XML COMPARE CONFIGURATION (MD-COMPARE DRY-RUN PREVIEW)
    # =========================================================================
    - name: Preview candidate configuration changes using md-compare RPC
      tags:
        - never
        - xml-compare-config
        - compare-config-xml
      block:
        - name: Execute Nokia md-compare NETCONF action RPC
          ansible.netcommon.netconf_rpc:
            rpc: action
            xmlns: "urn:ietf:params:xml:ns:yang:1"
            content: |
              <global-operations xmlns="urn:nokia.com:sros:ns:yang:sr:oper-global">
                <md-compare>
                  <format>md-cli</format>
                </md-compare>
              </global-operations>
          check_mode: false
          register: netconf_facts_compare_config_xml

        - name: Extract compare delta from XML response
          community.general.xml:
            xmlstring: "{{ netconf_facts_compare_config_xml.stdout }}"
            content: text
            xpath: /x:rpc-reply/nokiaoper:results/nokiaoper:md-compare-output
            namespaces:
              x: urn:ietf:params:xml:ns:netconf:base:1.0
              nokiaoper: urn:nokia.com:sros:ns:yang:sr:oper-global
          delegate_to: localhost
          check_mode: false
          register: compare_config

        - name: Display candidate configuration diff
          ansible.builtin.debug:
            msg: "{{ (compare_config.matches[0].values() | first) | default('No candidate differences detected.') }}"
          when: compare_config is not skipped and compare_config.matches is defined and (compare_config.matches | length > 0)
