---
- name: Rollback candidate changes
  hosts: all
  gather_facts: false

  tasks:
    - name: Cancel unconfirmed commit
      ansible.netcommon.netconf_rpc:
        rpc: cancel-commit
        xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
        content: |
          <persist-id>{{ sros_persist_id | default('sros-deploy') }}</persist-id>
      failed_when: false
      tags:
        - always
        - rollback

    - name: Cancel unconfirmed commit without persist-id
      ansible.netcommon.netconf_rpc:
        rpc: cancel-commit
        xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
      failed_when: false
      tags:
        - always
        - rollback

    - name: Discard staged candidate changes
      ansible.netcommon.netconf_rpc:
        rpc: discard-changes
        xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
      failed_when: false
      tags:
        - always
        - rollback

    - name: Release candidate datastore lock
      ansible.netcommon.netconf_rpc:
        rpc: unlock
        xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
        content: |
          <target>
            <candidate/>
          </target>
      failed_when: false
      tags:
        - always
        - rollback

    - name: Report rollback status
      ansible.builtin.debug:
        msg: "Commit cancelled on {{ inventory_hostname }}. Running configuration restored."
      tags:
        - always
        - rollback
