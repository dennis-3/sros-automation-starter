---
- name: Retrieve Nokia SR OS Operational State and Configuration
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Ensure snapshots directory exists
      ansible.builtin.file:
        path: snapshots
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true
      tags:
        - always

  tasks:
    # =========================================================================
    # JSON OPERATIONAL STATE
    # =========================================================================
    - name: Retrieve and save operational state in JSON format
      block:
        - name: Get state in JSON format via NETCONF
          ansible.netcommon.netconf_get:
            display: json
            filter: <state xmlns="urn:nokia.com:sros:ns:yang:sr:state"/>
          register: netconf_facts_state_json

        - name: Output state info to snapshots directory
          ansible.builtin.copy:
            content: "{{ netconf_facts_state_json.output.data | to_nice_json }}"
            dest: "snapshots/{{ inventory_hostname }}_state.json"
            mode: '0644'
          delegate_to: localhost
          when: netconf_facts_state_json.output.data is defined

        - name: Log state file creation
          ansible.builtin.debug:
            msg: "Saved snapshots/{{ inventory_hostname }}_state.json"
      tags:
        - never
        - json-state
        - state-json

    # =========================================================================
    # JSON RUNNING CONFIGURATION
    # =========================================================================
    - name: Retrieve and save configuration in JSON format
      block:
        - name: Get config in JSON format via NETCONF
          ansible.netcommon.netconf_get:
            display: json
            filter: <configure xmlns="urn:nokia.com:sros:ns:yang:sr:conf"/>
          register: netconf_facts_config_json

        - name: Output config info to snapshots directory
          ansible.builtin.copy:
            content: "{{ netconf_facts_config_json.output.data | to_nice_json }}"
            dest: "snapshots/{{ inventory_hostname }}_config.json"
            mode: '0644'
          delegate_to: localhost
          when: netconf_facts_config_json.output.data is defined

        - name: Log config file creation
          ansible.builtin.debug:
            msg: "Saved snapshots/{{ inventory_hostname }}_config.json"
      tags:
        - never
        - json-config
        - config-json

    # =========================================================================
    # YAML OPERATIONAL STATE
    # =========================================================================
    - name: Retrieve and save operational state in YAML format
      block:
        - name: Get state in YAML format via NETCONF
          ansible.netcommon.netconf_get:
            display: json
            filter: <state xmlns="urn:nokia.com:sros:ns:yang:sr:state"/>
          register: netconf_facts_state_yaml

        - name: Output state info to YAML file
          ansible.builtin.copy:
            content: "{{ netconf_facts_state_yaml.output.data | to_nice_yaml }}"
            dest: "snapshots/{{ inventory_hostname }}_state.yaml"
            mode: '0644'
          delegate_to: localhost
          when: netconf_facts_state_yaml.output.data is defined

        - name: Log YAML state file creation
          ansible.builtin.debug:
            msg: "Saved snapshots/{{ inventory_hostname }}_state.yaml"
      tags:
        - never
        - yaml-state
        - state-yaml

    # =========================================================================
    # YAML RUNNING CONFIGURATION
    # =========================================================================
    - name: Retrieve and save configuration in YAML format
      block:
        - name: Get config in YAML format via NETCONF
          ansible.netcommon.netconf_get:
            display: json
            filter: <configure xmlns="urn:nokia.com:sros:ns:yang:sr:conf"/>
          register: netconf_facts_config_yaml

        - name: Output config info to YAML file
          ansible.builtin.copy:
            content: "{{ netconf_facts_config_yaml.output.data | to_nice_yaml }}"
            dest: "snapshots/{{ inventory_hostname }}_config.yaml"
            mode: '0644'
          delegate_to: localhost
          when: netconf_facts_config_yaml.output.data is defined

        - name: Log YAML config file creation
          ansible.builtin.debug:
            msg: "Saved snapshots/{{ inventory_hostname }}_config.yaml"
      tags:
        - never
        - yaml-config
        - config-yaml

    # =========================================================================
    # XML OPERATIONAL STATE
    # =========================================================================
    - name: Retrieve and save operational state in XML format
      block:
        - name: Get state in XML format via NETCONF
          ansible.netcommon.netconf_get:
            display: xml
            filter: <state xmlns="urn:nokia.com:sros:ns:yang:sr:state"/>
          register: netconf_facts_state_xml

        - name: Output raw state XML to file
          ansible.builtin.copy:
            content: "{{ netconf_facts_state_xml.output }}"
            dest: "snapshots/{{ inventory_hostname }}_state.xml"
            mode: '0644'
          delegate_to: localhost
          when: netconf_facts_state_xml.output is defined

        - name: Log XML state file creation
          ansible.builtin.debug:
            msg: "Saved snapshots/{{ inventory_hostname }}_state.xml"
      tags:
        - never
        - xml-state
        - state-xml

    # =========================================================================
    # XML RUNNING CONFIGURATION
    # =========================================================================
    - name: Retrieve and save configuration in XML format
      block:
        - name: Get config in XML format via NETCONF
          ansible.netcommon.netconf_get:
            display: xml
            filter: <configure xmlns="urn:nokia.com:sros:ns:yang:sr:conf"/>
          register: netconf_facts_config_xml

        - name: Output raw config XML to file
          ansible.builtin.copy:
            content: "{{ netconf_facts_config_xml.output }}"
            dest: "snapshots/{{ inventory_hostname }}_config.xml"
            mode: '0644'
          delegate_to: localhost
          when: netconf_facts_config_xml.output is defined

        - name: Log XML config file creation
          ansible.builtin.debug:
            msg: "Saved snapshots/{{ inventory_hostname }}_config.xml"
      tags:
        - never
        - xml-config
        - config-xml