---
# ==============================================================================
# 01. PRE-FLIGHT VARIABLE SCHEMA VALIDATION
# ==============================================================================

- name: Validate global host variables
  ansible.builtin.assert:
    that:
      - system_name is defined or inventory_hostname is defined
      - cards is not defined or (cards | type_debug == 'list')
      - ports is not defined or (ports | type_debug == 'list')
      - interfaces is not defined or (interfaces | type_debug == 'list')
      - bgp is not defined or (bgp.asn is defined and (bgp.asn | int > 0))
      - isis is not defined or (isis.instance is defined or isis.net is defined)
      - ospf is not defined or (ospf.router_id is defined or ospf.area is defined or ospf.areas is defined)
    fail_msg: "Pre-flight validation failed on {{ inventory_hostname }}: Check host_vars syntax."
    success_msg: "Pre-flight schema validation passed for {{ inventory_hostname }}."
  tags:
    - always
    - preflight
    - validate

- name: Validate interface address attributes
  ansible.builtin.assert:
    that:
      - item.name is defined
      - >
        item.address is not defined or
        (((item.prefix_length is defined) or (item.mask is defined)) and
        ((item.prefix_length | default(item.mask)) | int >= 0) and
        ((item.prefix_length | default(item.mask)) | int <= 32))
    fail_msg: >
      Interface '{{ item.name | default('unnamed') }}' on {{ inventory_hostname }} has an invalid IP address
      or missing prefix length.
  loop: "{{ interfaces }}"
  when: interfaces is defined
  tags:
    - always
    - preflight
    - validate

- name: Clear stale uncommitted candidate changes to ensure clean baseline
  ansible.netcommon.netconf_rpc:
    rpc: discard-changes
    xmlns: "urn:ietf:params:xml:ns:netconf:base:1.0"
  check_mode: false
  when:
    - not (sros_commit_per_task | default(false))
    - sros_clean_candidate_start | default(true)
  failed_when: false
  tags:
    - always
    - preflight
