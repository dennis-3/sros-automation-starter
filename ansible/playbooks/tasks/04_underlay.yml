---
# ==============================================================================
# 04. UNDERLAY ROUTING & LABEL DISTRIBUTION (IGP & MPLS)
# ==============================================================================

- name: Configure MPLS Labels
  ansible.netcommon.netconf_config:
    target: candidate
    validate: "{{ sros_commit_per_task | default(false) }}"
    commit: "{{ sros_commit_per_task | default(false) }}"
    lock: "{{ 'always' if (sros_commit_per_task | default(false)) else 'never' }}"
    default_operation: merge
    content: "{{ lookup('template', '../templates/mpls_labels_template.j2') }}"
  when: mpls_labels is defined and (mpls_labels | length > 0)
  tags:
    - mpls-labels
    - segment-routing

