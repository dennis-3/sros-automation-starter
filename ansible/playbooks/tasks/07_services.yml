---
# ==============================================================================
# 07. VPN & MULTI-SERVICE INFRASTRUCTURE (L2VPN & L3VPN)
# ==============================================================================

- name: Configure SDPs
  ansible.netcommon.netconf_config:
    target: candidate
    validate: "{{ sros_commit_per_task | default(false) }}"
    commit: "{{ sros_commit_per_task | default(false) }}"
    lock: "{{ 'always' if (sros_commit_per_task | default(false)) else 'never' }}"
    default_operation: merge
    content: "{{ lookup('template', '../templates/sdp_template.j2') }}"
  when: sdp_configs is defined and (sdp_configs | length > 0)
  tags:
    - sdp
    - transport-tunnels

- name: Configure Pseudowire Templates
  ansible.netcommon.netconf_config:
