# =============================================================================
# DATA MODEL EXAMPLE: MPLS Signaling, Traffic Engineering & SDPs
# =============================================================================
# Used with:
# - templates/rsvp_template.j2
# - templates/mpls_template.j2
# - templates/ldp_template.j2
# - templates/sdp_template.j2
# - templates/pw_template.j2
# =============================================================================

# 1. RSVP-TE Traffic Engineering Protocol
rsvp:
  interfaces:
    - "system"
    - "toR2"

# 2. MPLS Protocol, Explicit Paths & LSPs
mpls:
  interfaces:
    - "system"
    - "toR2"
  paths:
    - name: "viaR2"
      hops:
        - address: "10.1.2.2"
          type: "strict"
  lsps:
    - name: "LSP-R1-to-R2"
      to: "10.10.10.2"
      type: "p2p-rsvp"
      path_computation_method: "local-cspf"
      primary:
        path_name: "viaR2"

# 3. LDP (Label Distribution Protocol & Targeted Sessions)
ldp:
  interfaces:
    - "toR2"
  targeted_sessions:
    - ip: "10.10.10.2"

# 4. Service Distribution Points (SDP Transport Tunnels)
sdp_configs:
  - id: 12
    description: "RSVP-SDP-to-R2"
    far_end_ip: "10.10.10.2"
    lsp_name: "LSP-R1-to-R2"
    keep_alive: true

  - id: 102
    description: "LDP-SDP-to-R2"
    far_end_ip: "10.10.10.2"
    signaling: "ldp"
    keep_alive: true

# 5. Pseudowire Templates (for Auto-Provisioned L2 Services)
pw_templates:
  - name: "PW-BGP-VPLS"
    id: 1
    description: "BGP-VPLS Provisioned SDP"
    provisioned_sdp: "use"
    shg_name: "mesh"

  - name: "PW-LDP-DYNAMIC"
    id: 2
    description: "Dynamic LDP Auto-Provision"
    shg_name: "mesh"
