# =============================================================================
# DATA MODEL EXAMPLE: BGP Peering & Route Policy Definitions
# =============================================================================
# Used with:
# - templates/policy_options_template.j2
# - templates/bgp_template.j2
# =============================================================================

# 1. Route Policy Options (Prefix Lists & Policy Statements)
policy_options:
  prefix_lists:
    - name: "Internal-Prefixes"
      prefixes:
        - { ip: "10.10.10.0/24", type: "longer" }
        - { ip: "192.168.0.0/16", type: "longer" }

  policy_statements:
    - name: "IMPORT-EBGP"
      description: "Filter incoming routes from eBGP peers"
      default_action: "reject"
      entries:
        - id: 10
          description: "Accept valid client CIDRs"
          from_prefix_list: ["Internal-Prefixes"]
          action: "accept"

    - name: "EXPORT-CORE"
      description: "Advertise loopback and direct subnets to core iBGP"
      default_action: "reject"
      entries:
        - id: 10
          from_protocol: "direct"
          action: "accept"

# 2. BGP Peering (iBGP, eBGP, MP-BGP Overlay)
bgp:
  asn: 65000
  router_id: "10.10.10.1"
  advertise_inactive: false

  groups:
    # Internal iBGP Peering
    - name: "iBGP-CORE"
      description: "Core iBGP Mesh (AS 65000)"
      next_hop_self: true
      family_ipv4: true
      family_vpn_ipv4: true
      family_l2vpn: true
      neighbors:
        - ip: "10.10.10.2"
          description: "R2-PE2"

    # External eBGP Peering
    - name: "eBGP-PEERS"
      description: "External Peering to AS 65100"
      peer_as: 65100
      import_policy: "IMPORT-EBGP"
      export_policy: ["EXPORT-CORE"]
      family_ipv4: true
      neighbors:
        - ip: "192.0.2.2"
          description: "Peer-Border-Router"
