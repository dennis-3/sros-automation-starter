testbed:
  name: nokia-lab

devices:
  r1:
    os: sros
    type: router
    connections:
      defaults:
        class: unicon.Unicon  # <--- CRITICAL: Tells pyATS how to handle the session
      cli:
        protocol: ssh
        ip: 172.20.20.9
    credentials:
      default:
        username: "%ENV{SROS_USER:-admin}"
        password: "%ENV{SROS_PASSWORD:-NokiaSros1!}"
