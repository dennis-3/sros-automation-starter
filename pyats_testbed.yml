testbed:
  name: nokia-lab

devices:
  r1:
    os: sros
    type: router
    connections:
      defaults:
        class: unicon.Unicon  # Defines Unicon connection handler
      cli:
        protocol: ssh
        ip: 172.20.20.9
    credentials:
      default:
        username: "%ENV{SROS_USER:-admin}"
        password: "%ENV{SROS_PASSWORD:-NokiaSros1!}"

