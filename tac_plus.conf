# The shared secret must match exactly on the router
key = "lab_secret_2026"

# Allow all routers within the Containerlab management subnet
client = sros-lab-subnet {
    address = 172.20.20.0/24
    key = "lab_secret_2026"
}

# Explicit client entry for primary node r1
client = r1 {
    address = 172.20.20.9
    key = "lab_secret_2026"
}

# Define a "Read-Only" Group (Authorization)
group = monitor {
	default service = deny
	service = shell {
		priv-lvl = 1
		cmd = show { permit .* }
	}
}

# Define an "Admin" Group
group = admins {
	default service = permit
	service = shell { priv-lvl = 15 }
}

# Define Users
user = dennis-admin {
	password = clear "admin123"
	member = admins
}

user = junior-tech {
	password = clear "tech123"
	member = monitor
}
