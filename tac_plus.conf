# ==============================================================================
# TACACS+ Daemon Configuration (Containerlab AAA Service)
# ==============================================================================
# WARNING: These are default credentials intended strictly for local lab simulation.
# Do NOT use default secrets or plain-text passwords in production environments.
# ==============================================================================

# Global shared secret for clients in the lab
key = "lab_secret_2026"

# Allow all routers within the Containerlab management subnet (172.20.20.0/24)
client = sros-lab-subnet {
    address = 172.20.20.0/24
    key = "lab_secret_2026"
}

# Explicit client entries for SR OS routers
client = r1 {
    address = 172.20.20.9
    key = "lab_secret_2026"
}

client = r2 {
    address = 172.20.20.2
    key = "lab_secret_2026"
}

# Define a "Read-Only" Group (Authorization)
group = monitor {
    default service = deny
    service = shell {
        priv-lvl = 1
        cmd = show { permit .* }
    }
}

# Define an "Admin" Group (Full Privileges)
group = admins {
    default service = permit
    service = shell { priv-lvl = 15 }
}

# Pre-seeded Lab Simulation Users
user = dennis-admin {
    password = clear "admin123"
    member = admins
}

user = junior-tech {
    password = clear "tech123"
    member = monitor
}
