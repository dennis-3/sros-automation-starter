[[inputs.gnmi]]
  addresses = ["pe1:57400"] # Use the name defined in topology.yml
  username = "admin"
  password = "NokiaSros1!" # it's recommended to change the default password
  encoding = "proto"
  redial = "10s"

  [[inputs.gnmi.subscription]]
    name = "sros_cpu"
    origin = "nokia"
    path = "/state/system/cpu/iom/cpu-usage"
    subscription_mode = "sample"
    sample_interval = "30s"

  [[inputs.gnmi.subscription]]
    name = "sros_port_stats"
    origin = "nokia"
    path = "/state/port/statistics"
    subscription_mode = "sample"
    sample_interval = "5s"

[[outputs.prometheus_client]]
  listen = ":9273" # Prometheus will scrape from here
