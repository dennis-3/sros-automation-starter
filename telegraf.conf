[[inputs.gnmi]]
  addresses = ["r1:57400", "r2:57400", "172.20.20.9:57400", "172.20.20.10:57400"]
  username = "admin"
  password = "NokiaSros1!" # Lab default credentials or match group_vars/all.yml
  encoding = "proto"
  redial = "10s"

  [[inputs.gnmi.subscription]]
    name = "sros_cpu"
    origin = "nokia"
    path = "/state/system/cpu/iom/cpu-usage"
    subscription_mode = "sample"
    sample_interval = "30s"

  [[inputs.gnmi.subscription]]
    name = "sros_port_stats"
    origin = "nokia"
    path = "/state/port/statistics"
    subscription_mode = "sample"
    sample_interval = "5s"

[[outputs.prometheus_client]]
  listen = ":9273" # Prometheus scrapes metrics from here
