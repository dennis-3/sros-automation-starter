# =====================================================================
# Telegraf Telemetry Configuration for Nokia SR OS
# gNMI Ingestion -> Prometheus Client Exporter
# =====================================================================

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  quiet = false
  logfile = ""

[[inputs.gnmi]]
  addresses = ["r1:57400", "r2:57400"]
  username = "$SROS_USER"
  password = "$SROS_PASSWORD"
  encoding = "proto"
  redial = "10s"

  # System overall CPU utilization
  [[inputs.gnmi.subscription]]
    name = "sros_cpu_summary"
    origin = "nokia"
    path = "/state/system/cpu/summary/usage/cpu-usage"
    subscription_mode = "sample"
    sample_interval = "15s"

  # IOM datapath CPU utilization
  [[inputs.gnmi.subscription]]
    name = "sros_cpu"
    origin = "nokia"
    path = "/state/system/cpu/iom/cpu-usage"
    subscription_mode = "sample"
    sample_interval = "15s"

  # System memory pools
  [[inputs.gnmi.subscription]]
    name = "sros_memory"
    origin = "nokia"
    path = "/state/system/memory-pools"
    subscription_mode = "sample"
    sample_interval = "30s"

  # Port packet statistics (octets, packets, discards, errors)
  [[inputs.gnmi.subscription]]
    name = "sros_port_stats"
    origin = "nokia"
    path = "/state/port/statistics"
    subscription_mode = "sample"
    sample_interval = "5s"

  # Port operational state
  [[inputs.gnmi.subscription]]
    name = "sros_port_oper"
    origin = "nokia"
    path = "/state/port/oper-state"
    subscription_mode = "sample"
    sample_interval = "5s"

  # Router interface state and statistics (Base router instance)
  [[inputs.gnmi.subscription]]
    name = "sros_interface"
    origin = "nokia"
    path = "/state/router[router-name=Base]/interface"
    subscription_mode = "sample"
    sample_interval = "10s"

  # BGP neighbor state and statistics (Base router instance)
  [[inputs.gnmi.subscription]]
    name = "sros_bgp_neighbor"
    origin = "nokia"
    path = "/state/router[router-name=Base]/bgp/neighbor"
    subscription_mode = "sample"
    sample_interval = "10s"

# Map string states to integer values for Prometheus metric export (1 = UP / Established, 0 = DOWN / Other)
[[processors.enum]]
  [[processors.enum.mapping]]
    field = "oper_state"
    dest = "oper_state_value"
    default = 0
    [processors.enum.mapping.value_mappings]
      up = 1
      down = 0

  [[processors.enum.mapping]]
    field = "session_state"
    dest = "session_state_value"
    default = 0
    [processors.enum.mapping.value_mappings]
      established = 1
      idle = 0
      active = 0
      connect = 0
      open_sent = 0
      open_confirm = 0

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
