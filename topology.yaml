name: sros-lab

topology:
  nodes:
    # --- SR OS Router Nodes ---
    r1:
      kind: nokia_srsim
      image: localhost/nokia/srsim:25.7.R1
      type: sr-1
      license: license/license.txt
      mgmt-ipv4: 172.20.20.9

    r2:
      kind: nokia_srsim
      image: localhost/nokia/srsim:25.7.R1
      type: sr-1
      license: license/license.txt
      mgmt-ipv4: 172.20.20.10

    # --- AAA Server ---
    aaa-server:
      kind: linux
      image: lfkeitel/tacacs_plus:ubuntu-202104181633
      mgmt-ipv4: 172.20.20.100
      binds:
        - tac_plus.conf:/etc/tac_plus/tac_plus.conf

    # --- Telemetry Stack ---
    telegraf:
      kind: linux
      image: telegraf:1.30.0
      mgmt-ipv4: 172.20.20.101
      binds:
        - telegraf.conf:/etc/telegraf/telegraf.conf:ro

    prometheus:
      kind: linux
      image: prom/prometheus:v2.51.0
      mgmt-ipv4: 172.20.20.102
      ports:
        - 9090:9090
      binds:
        - prometheus.yml:/etc/prometheus/prometheus.yml:ro

    grafana:
      kind: linux
      image: grafana/grafana:10.4.0
      mgmt-ipv4: 172.20.20.103
      ports:
        - 3000:3000
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"

  links:
    # Inter-router data plane link between r1 and r2 (port 1/1/c2/1:0)
    - endpoints: ["r1:eth1", "r2:eth1"]
