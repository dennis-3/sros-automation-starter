name: sros-lab

topology:
  defaults:
    kind: nokia_srsim

  kinds:
    nokia_srsim:
      image: "${SROS_IMAGE:-localhost/nokia/srsim:25.7.R1}"
      type: sr-1
      license: "${SROS_LICENSE:-license/license.txt}"

  nodes:
    # --- SR OS Router Nodes ---
    r1:
      mgmt-ipv4: 172.20.20.9

    r2:
      mgmt-ipv4: 172.20.20.2

    # --- Telemetry Stack ---
    telegraf:
      kind: linux
      image: telegraf:1.30.0
      mgmt-ipv4: 172.20.20.101
      env:
        SROS_USER: "${SROS_USER:-admin}"
        SROS_PASSWORD: "${SROS_PASSWORD:-NokiaSros1!}"
      binds:
        - telegraf.conf:/etc/telegraf/telegraf.conf:ro

    prometheus:
      kind: linux
      image: prom/prometheus:v2.51.0
      mgmt-ipv4: 172.20.20.102
      ports:
        - 9090:9090
      binds:
        - prometheus.yml:/etc/prometheus/prometheus.yml:ro

    grafana:
      kind: linux
      image: grafana/grafana:10.4.0
      mgmt-ipv4: 172.20.20.103
      ports:
        - 3000:3000
      binds:
        - grafana_datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"

  links:
    # Inter-router data plane link between r1 and r2 (port 1/1/c2/1)
    - endpoints: ["r1:1/1/c2/1", "r2:1/1/c2/1"]
